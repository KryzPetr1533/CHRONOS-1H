services:
  postgres:
    container_name: chronos_postgres
    image: postgres:16.2
    env_file: ./.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks: [internal]
    ports: ["5432:5432"]
    volumes:
      - ./build/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  mlflow-service:
    image: ghcr.io/mlflow/mlflow:v3.12.0
    container_name: chronos_mlflow
    env_file: ./.env
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    command:
      - bash
      - -c
      - |
        pip install boto3 psycopg2-binary --quiet
        exec mlflow server --host 0.0.0.0 --port 5000 \
          --allowed-hosts "chronos_mlflow:5000,localhost:5050,localhost:5000,127.0.0.1:*" \
          --workers 1 \
          --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB} \
          --default-artifact-root s3://mlflow-bucket/mlflow \
          --artifacts-destination s3://mlflow-bucket/mlflow \
          --serve-artifacts
    ports: ["5050:5000"]
    networks: [internal]
    depends_on: [postgres, minio]
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio
    container_name: chronos_minio
    env_file: ./.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "${S3_API_PORT}:9000"
      - "${S3_UI_PORT}:9001"
    volumes:
      - minio_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  mc:
    image: quay.io/minio/mc
    container_name: chronos_minio_mc
    env_file: ./.env
    networks: [internal]
    entrypoint: >
      bash -c "
      mc alias set minio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing minio/${DEFAULT_BUCKET_NAME} &&
      echo 'Bucket ready: '${DEFAULT_BUCKET_NAME}
      "
    depends_on:
      minio:
        condition: service_healthy
    restart: on-failure

volumes:
  minio_data:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ./data/minio_data

networks:
  internal:
    driver: bridge
