data_csv: outputs/datasets/btcusdt_rich_tabular.csv
output_dir: outputs/models/catboost_rich
model_name: catboost
split:
  train_frac: 0.6
  val_frac: 0.2
  test_frac: 0.2
cv_splits: 3
n_jobs: -1
baseline_col: log_ret_1h
param_grid:
  depth: [4, 6]
  learning_rate: [0.03, 0.05]
  n_estimators: [200, 400]
  l2_leaf_reg: [3, 10]